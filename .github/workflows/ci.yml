name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      benchmarks:
        description: Run forked JMH measurements after verification
        type: boolean
        default: false
      streaming_benchmarks:
        description: Run HTTP streaming throughput, latency, allocation, and retention measurements
        type: boolean
        default: false
      native_images:
        description: Run Quarkus and Micronaut HTTP contracts in native executables
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install compilation and test runtimes
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - name: Configure Gradle and validate the wrapper
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Build, test supported runtimes, and consume published artifacts
        # Exercise daemon JVM selection even when the wrapper starts on Java 17.
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: >-
          ./gradlew build compatibilityTest publicationSmokeTest :benchmarks:streaming-runner:smoke
          -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64
          --no-daemon --console=plain
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            build/reports/problems/
            benchmarks/streaming-runner/build/results/smoke/
          if-no-files-found: ignore

  benchmarks:
    if: github.event_name == 'workflow_dispatch' && inputs.benchmarks
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Measure compilation, trees, projection, encoding, and stream records
        run: >-
          ./gradlew :benchmarks:jmh
          -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64
          --no-daemon --console=plain
      - name: Preserve raw measurements and environment
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jmh-measurements
          path: benchmarks/build/results/
          if-no-files-found: error

  streaming-benchmarks:
    if: github.event_name == 'workflow_dispatch' && inputs.streaming_benchmarks
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Measure all five frameworks over HTTP
        run: >-
          ./gradlew :benchmarks:streaming-runner:measure
          -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64
          --no-daemon --console=plain
      - name: Preserve streaming measurements, source identity, and server logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: streaming-measurements
          path: benchmarks/streaming-runner/build/results/measure/
          if-no-files-found: error

  native-images:
    if: github.event_name == 'workflow_dispatch' && inputs.native_images
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        framework: [quarkus, micronaut]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - name: Install GraalVM 25
        id: graalvm
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: graalvm
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Verify Quarkus native HTTP behavior
        if: matrix.framework == 'quarkus'
        env:
          GRAALVM_HOME: ${{ steps.graalvm.outputs.path }}
        run: |
          native-image --version
          ./gradlew :examples:quarkus:testNative \
            -Dquarkus.native.enabled=true -Dquarkus.package.jar.enabled=false \
            -Dquarkus.native.native-image-xmx=4g \
            -Dquarkus.native.additional-build-args=--parallelism=2,-Ob \
            -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64 \
            --no-daemon --console=plain
      - name: Verify Micronaut native HTTP behavior
        if: matrix.framework == 'micronaut'
        env:
          GRAALVM_HOME: ${{ steps.graalvm.outputs.path }}
        run: |
          native-image --version
          ./gradlew :examples:micronaut:nativeTestCompile \
            --quick-build-native --jvm-args-native=-Xmx4g --build-args=--parallelism=2 \
            :examples:micronaut:nativeTest \
            -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64 \
            --no-daemon --console=plain
      - name: Preserve native test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.framework }}-reports
          path: |
            examples/${{ matrix.framework }}/build/test-results/
            examples/${{ matrix.framework }}/build/reports/tests/
            examples/${{ matrix.framework }}/build/quarkus.log
            examples/${{ matrix.framework }}/build/**/*build-output-stats.json
          if-no-files-found: error

